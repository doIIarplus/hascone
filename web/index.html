<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hascone · Character scanner</title><link rel="stylesheet" href="/static/styles/tokens.css"><link rel="stylesheet" href="/static/styles/app.css"><link rel="stylesheet" href="/static/scanner.css"></head>
<body><div class="header-shell"><header class="app-header"><button id="home" class="brand-home" aria-label="Home - character overview" title="Home - character overview"><span class="brand-mark">H</span><span><strong class="brand-name">Hascone <span class="home-hint"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m3 10 9-7 9 7v11H3Z"/><path d="M9 21v-8h6v8"/></svg> Home</span></strong><small class="brand-credit">made by @dollarplus</small></span></button><nav aria-label="Main navigation"><button data-page="equipment" class="btn">Equipment</button><button data-page="flame" class="btn">Flames</button><button data-page="potential" class="btn">Potentials</button><button data-page="starforce" class="btn">Star Force</button><button data-page="scouter" class="btn">Scouter</button><button data-page="hexa" class="btn">HEXA</button></nav><button id="add-character" class="btn">+ Add character</button><label class="header-character">Character<select id="character" class="input" aria-label="Selected character"></select></label><details id="settings-menu" class="settings-menu"><summary aria-label="Settings and zoom shortcuts" title="Settings and zoom shortcuts"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m9 3 1-1h4l1 3 3 1 3-1 2 4-2 2v3l2 2-2 4-3-1-3 1-1 3h-4l-1-3-3-1-3 1-2-4 2-2v-3L1 9l2-4 3 1 3-1z" transform="translate(1 0) scale(.92)"/><circle cx="12" cy="12" r="3"/></svg></summary><div><button class="btn" data-native="open-data-folder">Open data folder</button><div class="zoom-help"><strong>Zoom</strong><p><kbd>Ctrl</kbd> + mouse wheel</p><p><kbd>Ctrl</kbd> + <kbd>+</kbd> / <kbd>-</kbd></p><p>Reset: <kbd>Ctrl</kbd> + <kbd>0</kbd></p></div></div></details></header></div><div id="page-scroll"><div id="header-space" aria-hidden="true"></div><main id="view"></main><footer class="zoom-hint">Zoom: Ctrl + mouse wheel &middot; Reset: Ctrl + 0</footer></div><div id="toast" role="status"></div>
<dialog id="add-dialog"><form id="add-form"><h2>Add a character</h2><p class="sub">Enter their exact GMS character name. Nexon supplies their class and portrait.</p><label>Character name<input class="input" id="new-name" maxlength="16" required autocomplete="off" placeholder="e.g. Renmonade"></label><p id="add-error" role="status"></p><footer><button type="button" class="btn" id="add-cancel">Cancel</button><button class="btn btn-primary" id="add-submit">Find character</button></footer></form></dialog>
<dialog id="scan-dialog" aria-labelledby="scan-heading"><h2 id="scan-heading">Guided scan</h2><div id="scan-content"></div></dialog><script type="module" src="/static/app.js"></script></body></html>
