name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Python tests
        run: python -m pytest tests -q

      - name: JavaScript tests
        run: node --test tests/js/*.test.cjs

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify version and patch notes
        shell: pwsh
        run: |
          $version = (Select-String -Path tools/build_native.py -Pattern "^VERSION = '([^']+)'").Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          if ("${{ github.ref }}".StartsWith('refs/tags/') -and $tag -ne $version) {
            Write-Error "Tag v$tag does not match VERSION '$version' in tools/build_native.py. Update VERSION and retag."
            exit 1
          }
          $notes = "release-notes/$version.md"
          if (!(Test-Path -LiteralPath $notes) -or [string]::IsNullOrWhiteSpace((Get-Content -LiteralPath $notes -Raw))) {
            throw "Write user-facing patch notes in $notes before publishing."
          }
          "HASCONE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Download OCR recognition model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models/PP-OCRv6_medium_rec | Out-Null
          $base = "https://huggingface.co/PaddlePaddle/PP-OCRv6_medium_rec/resolve/main"
          foreach ($file in "inference.json", "inference.pdiparams", "inference.yml") {
            Invoke-WebRequest -Uri "$base/$file" -OutFile "models/PP-OCRv6_medium_rec/$file"
          }

      - name: Build portable executable
        run: python tools/build_native.py

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Hascone-Portable-*.exe
          body_path: release-notes/${{ env.HASCONE_VERSION }}.md
          generate_release_notes: false
